name: cafeteria-web

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:8080/ws}
    image: cafeteria-web:latest
    container_name: cafeteria-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
